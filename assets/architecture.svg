<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="#0b1220"/>
  <text x="500" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">How TeXCopy works · 工作原理</text>

  <!-- ================= row 1: main pipeline ================= -->

  <!-- user action -->
  <g filter="url(#sh)">
    <rect x="30" y="80" width="180" height="76" rx="12" fill="#1d4ed8"/>
  </g>
  <text x="120" y="112" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">🖱 Right-click</text>
  <text x="120" y="134" text-anchor="middle" font-size="12.5" fill="#dbeafe">“Copy as Markdown”</text>

  <!-- background -->
  <g filter="url(#sh)">
    <rect x="270" y="80" width="190" height="76" rx="12" fill="#1e293b" stroke="#334155"/>
  </g>
  <text x="365" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#93c5fd" font-family="ui-monospace, Menlo, Consolas, monospace">background.js</text>
  <text x="365" y="126" text-anchor="middle" font-size="11.5" fill="#94a3b8">MV3 service worker</text>
  <text x="365" y="144" text-anchor="middle" font-size="11.5" fill="#94a3b8">menu · routing · injection</text>

  <!-- content script group -->
  <g filter="url(#sh)">
    <rect x="520" y="62" width="240" height="150" rx="12" fill="#172554" stroke="#3b82f6" stroke-opacity="0.5"/>
  </g>
  <text x="640" y="86" text-anchor="middle" font-size="12" font-weight="600" fill="#60a5fa">content script (page world)</text>
  <rect x="540" y="98" width="200" height="46" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="640" y="117" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0" font-family="ui-monospace, Menlo, Consolas, monospace">serializer.js</text>
  <text x="640" y="134" text-anchor="middle" font-size="10.5" fill="#94a3b8">range-aware live-DOM walk</text>
  <rect x="540" y="154" width="200" height="46" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="640" y="173" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0" font-family="ui-monospace, Menlo, Consolas, monospace">math.js</text>
  <text x="640" y="190" text-anchor="middle" font-size="10.5" fill="#94a3b8">KaTeX / MathJax → LaTeX</text>
  <line x1="620" y1="144" x2="620" y2="154" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="660" y1="154" x2="660" y2="144" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- markdown output -->
  <g filter="url(#sh)">
    <rect x="820" y="80" width="150" height="76" rx="12" fill="#064e3b" stroke="#34d399" stroke-opacity="0.6"/>
  </g>
  <text x="895" y="108" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a7f3d0" font-family="ui-monospace, Menlo, Consolas, monospace">Markdown</text>
  <text x="895" y="128" text-anchor="middle" font-size="10.5" fill="#6ee7b7">$$x = \frac{-b}{2a}$$</text>
  <text x="895" y="146" text-anchor="middle" font-size="10.5" fill="#6ee7b7">```python · | tables | · ## h2</text>

  <!-- row1 arrows -->
  <line x1="210" y1="118" x2="266" y2="118" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="460" y1="118" x2="516" y2="118" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="760" y1="118" x2="816" y2="118" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- injection note under background -->
  <text x="365" y="188" text-anchor="middle" font-size="10.5" fill="#64748b">injects on demand via</text>
  <text x="365" y="204" text-anchor="middle" font-size="10.5" fill="#64748b" font-family="ui-monospace, Menlo, Consolas, monospace">chrome.scripting + activeTab</text>

  <!-- ================= row 2: clipboard strategy ================= -->

  <text x="500" y="262" text-anchor="middle" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">THREE-TIER CLIPBOARD WRITE · 三级剪贴板写入</text>

  <!-- tier 1 -->
  <g filter="url(#sh)">
    <rect x="60" y="290" width="250" height="82" rx="12" fill="#1e293b" stroke="#334155"/>
  </g>
  <text x="185" y="316" text-anchor="middle" font-size="12.5" font-weight="700" fill="#93c5fd">① In-page async API</text>
  <text x="185" y="336" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="ui-monospace, Menlo, Consolas, monospace">navigator.clipboard.writeText</text>
  <text x="185" y="356" text-anchor="middle" font-size="11" fill="#94a3b8">fast path, needs page permission</text>

  <!-- tier 2 -->
  <g filter="url(#sh)">
    <rect x="380" y="290" width="250" height="82" rx="12" fill="#1e293b" stroke="#334155"/>
  </g>
  <text x="505" y="316" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fcd34d">② execCommand fallback</text>
  <text x="505" y="336" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="ui-monospace, Menlo, Consolas, monospace">hidden textarea + copy</text>
  <text x="505" y="356" text-anchor="middle" font-size="11" fill="#94a3b8">selection saved &amp; restored</text>

  <!-- tier 3 -->
  <g filter="url(#sh)">
    <rect x="700" y="290" width="250" height="82" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.55"/>
  </g>
  <text x="825" y="316" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fbbf24">③ Offscreen document</text>
  <text x="825" y="336" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="ui-monospace, Menlo, Consolas, monospace">CLIPBOARD_WRITE reason</text>
  <text x="825" y="356" text-anchor="middle" font-size="11" fill="#94a3b8">no user gesture needed · always works</text>

  <!-- markdown → tier1 -->
  <path d="M 895 156 L 895 230 Q 895 242 883 242 L 197 242 Q 185 242 185 254 L 185 286" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrGreen)"/>

  <!-- tier arrows -->
  <line x1="310" y1="331" x2="376" y2="331" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrAmber)"/>
  <text x="343" y="320" text-anchor="middle" font-size="10.5" fill="#fbbf24">denied</text>
  <line x1="630" y1="331" x2="696" y2="331" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrAmber)"/>
  <text x="663" y="320" text-anchor="middle" font-size="10.5" fill="#fbbf24">denied</text>

  <!-- success toast -->
  <g filter="url(#sh)">
    <rect x="380" y="418" width="250" height="52" rx="12" fill="#1a7f37"/>
  </g>
  <text x="505" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">✓ Copied as Markdown toast</text>

  <line x1="185" y1="372" x2="185" y2="444" stroke="#34d399" stroke-width="2" marker-end="url(#arrGreen)" transform="translate(0,0)"/>
  <path d="M 185 444 L 376 444" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="240" y="436" font-size="10.5" fill="#34d399">ok</text>
  <line x1="825" y1="372" x2="825" y2="444" stroke="#34d399" stroke-width="2"/>
  <path d="M 825 444 L 634 444" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="740" y="436" font-size="10.5" fill="#34d399">written</text>
</svg>
